# Encontros Tech — manifestos Kubernetes da homologação (TRD, ADRs 002-014).
#
# O deploy é feito pelo workflow CD (.github/workflows/cd.yml) a cada CI verde na main:
# ele cria o namespace, cria/atualiza o Secret encontros-tech-secrets a partir do secret
# DATABASE_URL do GitHub e aplica este arquivo com a versão v<run_number> da CI — trocada só
# na cópia do runner, sem commit (ADR 013). Por isso a versão escrita aqui não é a que está rodando.
#
# Redeploy de uma versão: Actions → CD → Run workflow (input version, ex.: v42).
# Um "kubectl apply -f" manual deste arquivo volta o cluster para a versão escrita nele.
---
apiVersion: v1
kind: Namespace
metadata:
  name: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: encontros-tech-config
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: encontros-tech-hml
    app.kubernetes.io/version: "v27"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
data:
  APP_TITLE: "Encontros Tech"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "simple"
  SERVICE_NAME: "encontros-tech"
  SERVICE_VERSION: "v27"
  # PROMETHEUS_MULTIPROC_DIR não deve ser definida (ADR 004)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: encontros-tech-hml
    app.kubernetes.io/version: "v27"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech
        app.kubernetes.io/instance: encontros-tech-hml
        app.kubernetes.io/version: "v27"
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: encontros-tech
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: encontros-tech
              app.kubernetes.io/component: web
      containers:
        - name: encontros-tech
          # Sem command/args: usa o ENTRYPOINT/CMD da imagem (gunicorn, 2 workers sync — ADR 005)
          image: fabricioveronez/encontros-tech:v27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: encontros-tech-config
            - secretRef:
                name: encontros-tech-secrets
          # Sem probes, por decisão do TRD (Padrão dos manifestos Kubernetes)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # /tmp gravável: métricas Prometheus (criadas no import) e heartbeat dos workers do gunicorn
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: encontros-tech
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/instance: encontros-tech-hml
    app.kubernetes.io/version: "v27"
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: encontros-tech
    app.kubernetes.io/managed-by: kubectl
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
