apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech
  namespace: encontros-tech
  labels:
    app.kubernetes.io/name: encontros-tech
    app.kubernetes.io/component: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: encontros-tech
  template:
    metadata:
      labels:
        app.kubernetes.io/name: encontros-tech
        app.kubernetes.io/version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: guilhermescalin/encontros-tech:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: encontros-tech-config
            - secretRef:
                name: encontros-tech-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
