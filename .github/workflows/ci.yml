# CI (ADR 011/012): testes, build e push da imagem v<run_number> no Docker Hub.
# Ao terminar com sucesso, dispara o workflow CD (workflow_run).
name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "k8s/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3 # o projeto não publica tag maior (v10)
        with:
          version: "0.13.8" # mesmo pin do Dockerfile
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Rodar testes
        run: uv run pytest

  publish:
    name: Build e push da imagem
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: v${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Sem latest; sobrescrita de tag permitida (ADR 012)
          tags: ${{ vars.IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "Imagem publicada: \`${{ vars.IMAGE_NAME }}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
